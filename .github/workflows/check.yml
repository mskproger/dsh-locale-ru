name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify committed build
        run: git diff --exit-code -- lib

  harness-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read compatible Harness revision
        id: harness
        shell: bash
        run: echo "ref=$(node -p \"require('./harness-compatibility.json').ref\")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.harness.outputs.ref }}
          path: .harness
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir .harness install --frozen-lockfile
      - name: Check Harness keys and real profile installation
        run: pnpm run check:harness
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/.harness
